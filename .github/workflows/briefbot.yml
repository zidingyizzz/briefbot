name: BriefBot

on:
  schedule:
    - cron: "0 0 * * *"        # 08:00 Asia/Shanghai (UTC 00:00) — adjust to taste
  workflow_dispatch:           # allow manual runs from the Actions tab

# audit#11（2026-11-12 修）：手动触发与定时重叠会竞争写 .state 导致更新丢失——排队不取消
concurrency:
  group: briefbot-run
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore digest state       # remembers seen items / last snapshots
        if: hashFiles('config.yaml') != ''
        uses: actions/cache@v4
        with:
          path: .state
          key: briefbot-state-${{ github.run_id }}
          restore-keys: briefbot-state-

      - name: Install dependencies
        if: hashFiles('config.yaml') != ''
        run: pip install -r requirements.txt

      - name: Run BriefBot
        if: hashFiles('config.yaml') != ''
        run: python run.py --config config.yaml --once
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # M1（2026-11-16 修）：公开仓库没有 config.yaml（只有 config.example.yaml），
      # 定时触发原先必然红 X。有 config 才执行，没有则绿跳过并自解释。
      - name: No config.yaml — skipping (expected on the public repo)
        if: hashFiles('config.yaml') == ''
        run: echo "config.yaml not found — nothing to run. Copy config.example.yaml to config.yaml to enable this workflow."
